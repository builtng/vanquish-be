name: Deploy API to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_PATH: /home/u729684593/domains/api.vqtmanagement.com/public_html

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      # Production dependencies only: dev packages such as laravel/pail are
      # never shipped, so bootstrap/cache can't end up referencing them.
      - name: Install Composer dependencies (no dev)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # Never touches the server's .env, storage/, uploaded files or generated caches.
      - name: Upload application code
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='public/storage' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='vendor/' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_PATH}/"

      # vendor/ is mirrored exactly so removed packages disappear from the server.
      - name: Upload vendor
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            vendor/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_PATH}/vendor/"

      - name: Rebuild Laravel caches on server
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -se <<EOF
          set -e
          cd "${REMOTE_PATH}"
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
          php artisan package:discover --ansi
          php artisan optimize:clear
          # Uncomment once you want migrations to run automatically on deploy:
          # php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          EOF

      - name: Health check
        run: |
          body=$(curl -s https://api.vqtmanagement.com/api/user -H "Accept: application/json")
          echo "$body"
          echo "$body" | grep -q 'Unauthenticated' || { echo "API health check failed"; exit 1; }
